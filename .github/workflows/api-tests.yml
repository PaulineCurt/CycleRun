name: API tests

on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api-tests.yml'

jobs:
  phpunit:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: cyclerun_testing
          POSTGRES_USER: cyclerun
          POSTGRES_PASSWORD: cyclerun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyclerun"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: cyclerun_testing
      DB_USERNAME: cyclerun
      DB_PASSWORD: cyclerun

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: api/vendor
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test
