services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cyclerun
      POSTGRES_USER: cyclerun
      POSTGRES_PASSWORD: cyclerun
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
